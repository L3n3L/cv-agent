<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVAgent 工作台 Demo v2</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="CVAgent 导航">
        <div class="brand-lockup"><strong>CVAgent</strong><span>简历制作工作台</span></div>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起导航栏" aria-expanded="true"><span aria-hidden="true">‹</span><small>收起</small></button>
        <button class="workspace-switcher" id="workspaceSwitcher" type="button" aria-expanded="false">
          <span class="workspace-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l2 2h8v8.5H4z"/><path d="M4 7.5V6h6l2 2"/></svg></span>
          <span class="workspace-copy"><small>当前工作区</small><b id="workspaceLabel">林能隆 · AI 产品经理校招</b></span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="workspace-menu" id="workspaceMenu" hidden>
          <button type="button" data-workspace="林能隆 · AI 产品经理校招">林能隆 · AI 产品经理校招<small>resume.md · 3 个投递版本</small></button>
          <button type="button" data-workspace="游戏系统策划 · 投递工作区">游戏系统策划 · 投递工作区<small>resume.md · 1 个投递版本</small></button>
        </div>
        <nav class="primary-nav" aria-label="简历制作模块">
          <p class="nav-caption">简历制作</p>
          <button class="nav-item active" data-route="workbench" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></span><span>工作台</span></button>
          <button class="nav-item" data-route="preview" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="8" y="8" width="8" height="8"/></svg></span><span>预览</span></button>
          <button class="nav-item" data-route="templates" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg></span><span>模板库</span></button>
          <button class="nav-item" data-route="checks" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span><span>排版检查</span><em class="nav-badge">3</em></button>
          <button class="nav-item" data-route="versions" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>投递版本</span></button>
        </nav>
        <section class="session-section" aria-label="当前工作区会话">
          <div class="section-heading"><span>会话</span><button type="button" title="新建会话" id="newSession">＋</button></div>
          <button class="session-item active" data-session="campus" type="button"><span class="session-dot"></span><span><b>校招一页版</b><small>草稿 · 3 个阻断项</small></span></button>
          <button class="session-item" data-session="product" type="button"><span class="session-dot"></span><span><b>AI 产品经理定向版</b><small>已渲染 · 待确认</small></span></button>
          <button class="session-item" data-session="compress" type="button"><span class="session-dot"></span><span><b>压缩项目经历</b><small>已保存 · 3 天前</small></span></button>
        </section>
        <div class="sidebar-foot"><div class="connection"><i></i>本地工作区已连接</div><button class="settings-button" type="button">设置</button></div>
      </aside>
      <div class="resize-handle resize-sidebar" data-resize="sidebar" role="separator" aria-orientation="vertical" aria-label="调整导航栏宽度" aria-valuemin="0" aria-valuemax="360" tabindex="0"></div>
      <main class="main-stage">
        <header class="route-header">
          <div class="route-heading"><div class="eyebrow" id="routeKicker">简历工作台</div><div class="route-title-line"><h1 id="routeTitle">校招一页版</h1><span class="status-pill" id="routeStatus">草稿 · 3 个阻断项</span></div><p id="routeMeta">resume.md · 校招标准 · A4</p></div>
          <div class="route-actions" id="routeActions"><button class="ghost-button" id="workbenchAssistantButton" type="button">打开 Agent</button></div>
        </header>
        <section class="route-view" id="routeView" aria-live="polite"></section>
      </main>
      <div class="resize-handle resize-assistant" data-resize="assistant" role="separator" aria-label="调整 Agent 面板宽度" aria-orientation="vertical" aria-valuemin="300" aria-valuemax="520" tabindex="0"></div>
      <aside class="assistant-drawer" id="assistantDrawer" aria-label="Agent 助手面板" aria-hidden="true" hidden>
        <div class="drawer-header"><div><h2>Agent</h2></div><button class="ghost-button" id="drawerClose" type="button">收起</button></div>
        <div class="assistant-context" title="仅作用于当前会话"><span>校招一页版 · 当前草稿</span></div>
        <div id="assistantContent"></div>
      </aside>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
